<!DOCTYPE html>
<html>
<head>
    <script src="index.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="panel-container">
        <!-- MAIN VIEW -->
        <div id="view-main">
            <div class="info-bar" id="info-print-size">Open a document to begin</div>
            <div class="scale-row">
                <label>Scale to:</label>
                <input type="number" id="scale-width" value="10" min="1" max="100" step="0.5">
                <span>x</span>
                <input type="number" id="scale-height" value="15" min="1" max="100" step="0.5">
                <span>in</span>
            </div>

            <div class="section-box">
                <div class="section-title">Halftone</div>
                <div class="row-between">
                    <label class="checkbox-row">
                        <input type="checkbox" id="enable-halftone" checked>
                        <span>Enable Halftone</span>
                    </label>
                    <select id="halftone-shape">
                        <option value="round" selected>Round</option>
                        <option value="diamond">Diamond</option>
                        <option value="ellipse">Ellipse</option>
                        <option value="line">Line</option>
                        <option value="square">Square</option>
                        <option value="cross">Cross</option>
                    </select>
                </div>
                <div class="row-between">
                    <div class="input-group">
                        <label>Frequency / Inch</label>
                        <input type="number" id="halftone-frequency" value="20" min="1" max="120">
                    </div>
                    <div class="input-group">
                        <label>Angle</label>
                        <input type="number" id="halftone-angle" value="33" min="0" max="360">
                    </div>
                </div>
            </div>

            <!-- Shirt Color Mode -->
            <div class="row-between knockout-row">
                <span class="label-text">Shirt Mode</span>
                <select id="shirt-mode">
                    <option value="light" selected>Light Shirt</option>
                    <option value="dark">Dark Shirt</option>
                </select>
            </div>

            <!-- Color Knockout -->
            <div class="row-between knockout-row">
                <label class="checkbox-row">
                    <input type="checkbox" id="enable-knockout">
                    <span>Color Knockout</span>
                </label>
                <div class="color-swatch" id="swatch-knockout" title="Click to pick color to knockout">
                    <div class="swatch-fill" id="swatch-knockout-fill"></div>
                </div>
            </div>
            <div class="slider-row" style="padding:4px 0;">
                <label>Fuzziness:</label>
                <input type="range" id="knockout-fuzziness" min="0" max="150" value="40">
                <input type="number" id="knockout-fuzziness-val" value="40" min="0" max="150" style="width:40px;">
            </div>

            <!-- Shirt/BG Preview Color -->
            <div class="row-between shirt-row">
                <span class="label-text">Set Shirt/BG Preview Color</span>
                <div class="color-swatch" id="swatch-shirt" title="Click to open color picker">
                    <div class="swatch-fill" id="swatch-shirt-fill"></div>
                </div>
            </div>

            <p class="helper-text">Pick a knockout color to remove specific colors from the artwork.</p>

            <div class="bottom-row">
                <button id="btn-run-dtprep" class="btn-cta">Run DTPREP</button>
            </div>
        </div>

        <!-- ADJUSTMENT VIEW -->
        <div id="view-adjust" style="display:none;">
            <div class="row-between" style="margin-bottom:10px;">
                <button id="btn-default-sliders" class="btn-secondary">Default Sliders</button>
                <button id="btn-edit-halftones" class="btn-secondary">Edit Halftones</button>
            </div>

            <div class="slider-group">
                <div class="slider-row">
                    <label>White Point</label>
                    <input type="range" id="adj-white-point" min="200" max="255" value="255">
                    <input type="number" id="adj-white-point-val" value="255" min="200" max="255">
                </div>
                <div class="slider-row">
                    <label>Black Point</label>
                    <input type="range" id="adj-black-point" min="0" max="55" value="0">
                    <input type="number" id="adj-black-point-val" value="0" min="0" max="55">
                </div>
                <div class="slider-row">
                    <label>Gray Point</label>
                    <input type="range" id="adj-gray-point" min="0.1" max="9.99" value="1.0" step="0.01">
                    <input type="number" id="adj-gray-point-val" value="1.0" min="0.1" max="9.99" step="0.01">
                </div>
                <div class="slider-row">
                    <label>Boost Shadow</label>
                    <input type="range" id="adj-boost-shadow" min="0" max="100" value="0">
                    <input type="number" id="adj-boost-shadow-val" value="0" min="0" max="100">
                </div>
            </div>

            <div class="preview-tabs">
                <button class="tab-btn active" data-mode="original">Original</button>
                <button class="tab-btn" data-mode="shirt">Shirt</button>
                <button class="tab-btn" data-mode="alpha">Alpha</button>
                <button class="tab-btn" data-mode="mask">Mask</button>
            </div>

            <div class="post-cleanup">
                <span>Post Cleanup</span>
                <label><input type="radio" name="cleanup" value="none"> None</label>
                <label><input type="radio" name="cleanup" value="standard" checked> Standard</label>
                <label><input type="radio" name="cleanup" value="high"> High</label>
            </div>

            <div class="row-between" style="margin-top:12px;">
                <button id="btn-cancel" class="btn-secondary">Cancel</button>
                <button id="btn-apply" class="btn-cta">Apply</button>
            </div>
        </div>

        <!-- EDIT HALFTONE DIALOG -->
        <div id="dialog-halftone" style="display:none;">
            <div class="dialog-box">
                <div class="dialog-header">
                    <span>Edit Halftone Settings</span>
                    <button id="btn-close-dialog" class="close-btn">&times;</button>
                </div>
                <div class="section-box">
                    <div class="section-title">Halftone</div>
                    <div class="row-between">
                        <label class="checkbox-row">
                            <input type="checkbox" id="dialog-enable-halftone" checked>
                            <span>Enable Halftone</span>
                        </label>
                        <select id="dialog-halftone-shape">
                            <option value="round">Round</option>
                            <option value="diamond">Diamond</option>
                            <option value="ellipse">Ellipse</option>
                            <option value="line">Line</option>
                            <option value="square">Square</option>
                            <option value="cross">Cross</option>
                        </select>
                    </div>
                    <div class="row-between">
                        <div class="input-group">
                            <label>Frequency / Inch</label>
                            <input type="number" id="dialog-frequency" value="20" min="1" max="120">
                        </div>
                        <div class="input-group">
                            <label>Angle</label>
                            <input type="number" id="dialog-angle" value="33" min="0" max="360">
                        </div>
                    </div>
                </div>
                <button id="btn-dialog-ok" class="btn-cta" style="margin-top:12px;width:100%;">OK</button>
            </div>
        </div>
    </div>
</body>
</html>
